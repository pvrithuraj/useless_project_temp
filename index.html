<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Kuru Kuru~</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
    <link rel="stylesheet" href="static/css/style.css" type="text/css" />
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/ionicons/4.6.1/css/ionicons.min.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/mdui/1.0.2/css/mdui.min.css" />
</head>
<body class="mdui-theme-primary-purple mdui-theme-accent-blue">
    <div class="mdui-container-fluid">
        <main class="wrapper">
            <div id="wrapper-background-filter"></div>
            <div id="wrapper-background"></div>
            <div id="content">
                <div id="title-container">
                    <h1 id="page-title">Welcome to kuru kuru~</h1>
                </div>

                <h2 id="page-descriptions">
                    This is just a useless website. Do whatever you want. Kuru kuru~!
                </h2>
                <div id="counter-container">
                    <h3 id="counter-descriptions">The kuru~ has been squished for</h3>
                    <br />
                    <br />
                    <p id="local-counter">0</p>
                    <br />
                    <br />
                    <p id="counter-unit">times</p>
                    <button id="counter-button">Kuru kuru~!</button>
                    <br />
                    <button id="webcam-button">📷 Switch to Webcam</button>
                    <div id="loading"></div>
                </div>
                <div id="grid">
                    <noscript>Your browser does not support JavaScript or JavaScript has been
                        disabled.<br />This website relies on JavaScript, so please enable it
                        or use another browser.</noscript>
                </div>

                <div id="webcam-container" class="hidden">
                    <div id="webcam-frame">
                        <video id="webcam-video" autoplay playsinline muted></video>
                        <canvas id="webcam-canvas"></canvas>
                        <div id="webcam-status">Loading face detector…</div>
                        <button id="webcam-close">✕</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.bootcdn.net/ajax/libs/mdui/1.0.2/js/mdui.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="static/js/script.js"></script>
</body>
</html>
